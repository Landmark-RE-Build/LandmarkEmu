# LandmarkEmu auth stack: the database server, the auth (login) server and the account website. It holds everything
# shared by all worlds: accounts, the server list and the characters (one character travels to every world, as on live
# Landmark). Each world server runs in its own container (docker/world) and keeps its own world database here
# (lmemu_world_<name>).
#
# The project's docker-compose.yml (in the project folder) uses these service definitions: start everything from there
# with "docker compose up -d". This file can also run the auth stack on its own, with the settings passed in:
#
#   docker compose --env-file ../../.env -p landmarkemu-auth up -d --build
name: landmarkemu-auth

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_USER: landmarkemu
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
      - ../db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Only on this PC, for tools like HeidiSQL; not reachable from other machines.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    networks:
      landmarkemu:
        aliases: [landmarkemu-db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: auth
    # AUTH_IMAGE: another tag for this build, so a second build can stand beside the running one
    # without replacing its image (e.g. a project started with its own -p name and env file, as in
    # docker/worlds/extra-world.env.example).
    image: ${AUTH_IMAGE:-landmarkemu-auth}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Auth__ConnectionString: server=landmarkemu-db;port=3306;user=landmarkemu;password=${DB_PASSWORD};database=lmemu_auth
      Database__Character__ConnectionString: server=landmarkemu-db;port=3306;user=landmarkemu;password=${DB_PASSWORD};database=lmemu_character
      GameDataPath: /gamedata
      Network__Port: ${LOGIN_PORT:-20042}
      # The account API listens on 5000 inside the container (the website calls it there); ACCOUNT_PORT is outside.
      WebApi__BaseURI: http://0.0.0.0:5000
      # Empty: each world registers its own address (its PublicAddress). Set only to force one address for all worlds.
      WorldAddress: ""
      # The account website (service "web") may pass on the player's address; sign-up limits.
      WebApi__TrustedProxy: ${WEB_SUBNET_PREFIX:-172.30.77}.10
      WebApi__RegistrationOpen: ${REGISTRATION_OPEN:-true}
      WebApi__RegistrationsPerAddressPerHour: ${REGISTRATIONS_PER_ADDRESS_PER_HOUR:-3}
      WebApi__RegistrationsPerHour: ${REGISTRATIONS_PER_HOUR:-60}
      # Character names RPG-style only (capital first letter, letters only, no spaces); false (default) = any allowed name.
      CreationRules__StrictName: ${STRICT_NAMES:-false}
      # Each character in the character list carries its friends list, as on live (the client counts each world's online
      # friends from it). false = sent empty.
      CharacterSelectFriends: ${CHARACTER_SELECT_FRIENDS:-true}
      # The shared social service (docker/social, the worlds' SOCIAL_ADDRESS): those friends lists and who is online come
      # from it. Empty: from the character database, every friend shown offline.
      SocialAddress: ${SOCIAL_ADDRESS:-}
      # What LaunchPad shows for this server (docs/launchpad.md): name, website link (default: the account website on
      # PUBLIC_HOST), required game build, news.
      WebApi__ServerName: ${SERVER_NAME:-LandmarkEmu}
      WebApi__WebsiteUrl: ${WEBSITE_URL:-http://${PUBLIC_HOST:-127.0.0.1}:${WEBSITE_PORT:-8080}/}
      WebApi__RequiredClientBuild: ${REQUIRED_CLIENT_BUILD:-}
      WebApi__NewsFile: /launcher/news.json
      # The patch folder (PATCH_DIR): drop the update pack (.lmpatch) there. Each pack is checked with the rules players'
      # LaunchPad uses before it is served; refused ones are moved to rejected/ (docs/launchpad.md "Server side").
      WebApi__PatchFolder: /launcher/patches
      # A Steam 0.589 copy mounted for the check (PATCH_VERIFY_STEAM_DIR); an empty folder = none.
      WebApi__PatchVerifySteamDir: /patch-verify-steam
    volumes:
      # The server's game data: copied from your Landmark folder by the setup service (docker-compose.yml).
      - ${GAME_DATA_DIR:-../../server-data/gamedata}:/gamedata:ro
      - ${LAUNCHER_DIR:-../launcher}:/launcher:ro
      # Writable: refused packs are moved to its rejected/ folder.
      - ${PATCH_DIR:-../launcher/patches}:/launcher/patches
      # Optional, read-only: with a Steam 0.589 copy here the check also replays every edit and patch in a pack.
      - ${PATCH_VERIFY_STEAM_DIR:-../launcher/no-steam-copy}:/patch-verify-steam:ro
    ports:
      # The game login port is the same inside and outside the container.
      - "${LOGIN_PORT:-20042}:${LOGIN_PORT:-20042}/udp"
      - "${ACCOUNT_PORT:-5000}:5000/tcp"
    # The login service's internal port (gateways in their own container consume tickets there; never published).
    expose:
      - "20210"
    networks:
      landmarkemu:
        aliases: [landmarkemu-login]
      landmarkemu-web:
        aliases: [landmarkemu-auth-api]

  # The account website: a sign-up page and one rate-limited route to the auth server (docker/web/nginx.conf). It is
  # only on the landmarkemu-web network, so it can reach the auth server's account API and nothing else (not the
  # database, not the worlds), and it has no passwords.
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on: [auth]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/site:/usr/share/nginx/html:ro
    ports:
      - "${WEBSITE_PORT:-8080}:8080/tcp"
    networks:
      landmarkemu-web:
        ipv4_address: ${WEB_SUBNET_PREFIX:-172.30.77}.10

volumes:
  db:

networks:
  # World containers join this network to reach the database (see docker/world/docker-compose.yml).
  landmarkemu:
    name: ${NETWORK_NAME:-landmarkemu}
  # The website and the auth server only (fixed range: the auth server trusts the website's address).
  landmarkemu-web:
    name: ${NETWORK_NAME:-landmarkemu}-web
    ipam:
      config:
        - subnet: ${WEB_SUBNET_PREFIX:-172.30.77}.0/24
