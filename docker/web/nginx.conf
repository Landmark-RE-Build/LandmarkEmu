# Account website: the sign-up page, and one route (/api/register) passed to the auth server's /srp/register.
# The web container is on its own network with the auth server only: it has no database access or credentials.

# Sign-ups per player address (5 a minute, a few at once), and from everyone together (60 a minute).
limit_req_zone $binary_remote_addr zone=register_ip:10m rate=5r/m;
limit_req_zone $server_name zone=register_all:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

server {
    listen 8080;
    # Docker's DNS: the auth server's address is looked up again when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    client_max_body_size 1k;
    limit_conn conn_ip 20;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri /index.html;
    }

    location = /api/register {
        limit_except POST { deny all; }
        limit_req zone=register_ip burst=3 nodelay;
        limit_req zone=register_all burst=20 nodelay;
        limit_req_status 429;
        # The player's address for the auth server's own per-address limit. Replaced, not appended, so a client
        # can't send a fake one. (Behind another proxy such as Cloudflare, set real_ip_header / set_real_ip_from.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host auth;
        # HTTP/1.1 to the auth server: Kestrel refuses a body-less HTTP/1.0 POST (no Content-Length).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_pass http://landmarkemu-auth-api:5000/srp/register$is_args$args;
    }

    # Nothing else reaches the auth server through the website.
    location /api/ { return 404; }
}
