<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandmarkEmu account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Create a LandmarkEmu account</h1>
  <p class="lead">One account works on every world server. Your password never leaves this page: your browser turns it
    into a one-way verifier, and only that is sent.</p>

  <form id="register" autocomplete="off" novalidate>
    <label for="username">Account name</label>
    <input id="username" name="username" maxlength="32" autocomplete="username" required
           pattern="[A-Za-z0-9_]{3,32}" placeholder="3 to 32 letters, digits or _">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>

    <label for="confirm">Password again</label>
    <input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" required>

    <!-- Left empty by people; bots that fill every field are refused. -->
    <div class="trap" aria-hidden="true">
      <label for="website">Website</label>
      <input id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button id="submit" type="submit">Create account</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <p class="small">Then sign in with this name and password in the LandmarkEmu launcher.</p>
</main>
<script src="srp.js"></script>
<script src="register.js"></script>
</body>
</html>
