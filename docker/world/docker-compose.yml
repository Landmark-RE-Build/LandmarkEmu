# One LandmarkEmu world server (a "server" in the game's server list): the whole set of landscapes with its own build
# sites, props and terrain, in its own database (lmemu_world_<WORLD_KEY>) on the auth stack's database server.
# Characters are shared with every other world.
#
# The project's docker-compose.yml runs the first world from this definition. A second world runs this file on its own,
# next to the running project, with the project's .env and the world's own file (docker/worlds/extra-world.env.example):
#
#   docker compose --env-file .env --env-file docker/worlds/liberation.env -p landmarkemu-world-liberation -f docker/world/docker-compose.yml up -d
#
# It appears in the server list by itself (docs/docker.md, "More worlds").
services:
  world:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: world
    image: landmarkemu-world
    restart: unless-stopped
    environment:
      Database__Auth__ConnectionString: server=landmarkemu-db;port=3306;user=landmarkemu;password=${DB_PASSWORD:?Set DB_PASSWORD in .env};database=lmemu_auth
      Database__Character__ConnectionString: server=landmarkemu-db;port=3306;user=landmarkemu;password=${DB_PASSWORD};database=lmemu_character
      # This world's own data (build sites, props, chests, vendors, prop links).
      Database__Zone__ConnectionString: server=landmarkemu-db;port=3306;user=landmarkemu;password=${DB_PASSWORD};database=lmemu_world_${WORLD_KEY:-main}
      Database__Zone__Provider: MySql
      GameDataPath: /gamedata
      GameDirectory: /game
      ZoneServerId: ${WORLD_ID:-1}
      WorldNameId: ${WORLD_NAME_ID:-62147}
      PublicAddress: ${PUBLIC_HOST:-127.0.0.1}:${WORLD_PORT:-19000}
      Network__Port: ${WORLD_PORT:-19000}
      WebPagesPort: ${WEB_PAGES_PORT:-19001}
      # Listen on every interface in the container: the default (loopback) can't be reached through the port mapping.
      WebPagesHost: 0.0.0.0
      WebPagesUrl: http://${PUBLIC_HOST:-127.0.0.1}:${WEB_PAGES_PORT:-19001}
      # Admins (account or character names): in-game admin commands and the /admin menu.
      Admins__0: ${ADMIN_ACCOUNT:-}
      Admins__1: ${ADMIN_2:-}
      Admins__2: ${ADMIN_3:-}
    volumes:
      - ${GAME_DATA_DIR:-../../server-data/gamedata}:/gamedata:ro
      - ${GAME_DIR:?Set GAME_DIR in .env to your Landmark folder}:/game:ro
      # This world's saved files (terrain edits, felled trees, screenshots...), its console.log and dev_commands.txt:
      # server-data/worlds/<WORLD_KEY> in the project folder, unless WORLD_DATA_DIR names another folder.
      - ${WORLD_DATA_DIR:-../../server-data/worlds/${WORLD_KEY:-main}}:/data
    ports:
      - "${WORLD_PORT:-19000}:${WORLD_PORT:-19000}/udp"
      - "${WEB_PAGES_PORT:-19001}:${WEB_PAGES_PORT:-19001}/tcp"
    networks: [landmarkemu]

networks:
  landmarkemu:
    external: true
