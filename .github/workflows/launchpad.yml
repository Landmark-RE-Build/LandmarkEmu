# Builds LaunchPad.exe (self-contained single file: no .NET install needed; WebView2 ships with Windows 10/11).
#
# Uses no outside actions (the org allows only actions from its own repositories): the checkout is plain git, .NET
# comes from Microsoft's dotnet-install script and uploads use the gh CLI that GitHub's runners already have.
#
# - Pull requests that touch LaunchPad or what it uses: the tests run and LaunchPad.exe is built (a check only).
# - By hand (Actions > LaunchPad > Run workflow, on any branch) and pushes to main: the build goes to a pre-release
#   "LaunchPad dev build (<branch>)" (tag launchpad-dev-<branch>), replaced by each new build, so a change can be
#   tried without building it yourself.
# - A published release (Releases > Draft a new release > Publish) builds its tag and attaches LaunchPad.exe and the
#   .sha256 to the release; re-running replaces them.
#
# The terrain heights zip is not built here: it is made from the game's own files, which never go into this repository.
name: LaunchPad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LandmarkEmulator.LaunchPad/**"
      - "LandmarkEmulator.PatchPacks/**"
      - "LandmarkEmulator.ClientLaunch/**"
      - "LandmarkEmulator.Shared/**"
      - ".github/workflows/launchpad.yml"
  pull_request:
    paths:
      - "LandmarkEmulator.LaunchPad/**"
      - "LandmarkEmulator.PatchPacks/**"
      - "LandmarkEmulator.ClientLaunch/**"
      - "LandmarkEmulator.Shared/**"
      - ".github/workflows/launchpad.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: launchpad-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # release assets and the dev pre-release
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (plain git)
        env:
          REF: ${{ github.event.release.tag_name || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$env:REF"
          git checkout -q FETCH_HEAD
          git log -1 --format="Building %H (%s)"

      - name: Install .NET 10 SDK
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "dotnet"
          $script = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile $script
          & $script -Channel 10.0 -InstallDir $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test
        run: dotnet test LandmarkEmulator.sln -c Release

      - name: Build LaunchPad.exe
        run: dotnet publish LandmarkEmulator.LaunchPad -c Release -o out/LaunchPad

      - name: Checksum
        run: |
          $hash = (Get-FileHash out/LaunchPad/LaunchPad.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LaunchPad.exe" | Out-File -Encoding ascii out/LaunchPad/LaunchPad.exe.sha256
          "LaunchPad.exe SHA-256: $hash" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" out/LaunchPad/LaunchPad.exe out/LaunchPad/LaunchPad.exe.sha256 --clobber --repo "${{ github.repository }}"

      - name: Dev pre-release for this branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          $branch = "${{ github.ref_name }}" -replace '[^\w\.\-]+', '-'
          $tag = "launchpad-dev-$branch"
          # One pre-release per branch, rebuilt each time so its tag points at the commit that was built.
          gh release delete $tag --cleanup-tag --yes --repo "${{ github.repository }}" 2>$null
          gh release create $tag out/LaunchPad/LaunchPad.exe out/LaunchPad/LaunchPad.exe.sha256 --prerelease `
            --target "${{ github.sha }}" --title "LaunchPad dev build ($branch)" `
            --notes "Built from ${{ github.sha }} by the LaunchPad workflow. Not an official release." `
            --repo "${{ github.repository }}"
          "Download: https://github.com/${{ github.repository }}/releases/tag/$tag" | Out-File -Append $env:GITHUB_STEP_SUMMARY
